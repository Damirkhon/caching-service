[project]
name = "caching-service"
version = "0.1.0"
description = "Caches results of a slow external transformer and builds interleaved payloads from them."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cache-cli = "cache_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caching_service", "src/cache_cli"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Honour excludes even when pre-commit passes file names explicitly.
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "RUF",
    "ASYNC", "PT", "C4", "PTH", "TRY", "ERA",
]

[tool.ruff.lint.per-file-ignores]
# S311: seeded `random` generates reproducible test data, not secrets.
"tests/**" = ["S101", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["caching_service", "cache_cli", "tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# A deadlocked concurrency test fails instead of hanging the run.
timeout = 30
# Deprecations surface as failures now rather than as breakage on the next upgrade.
filterwarnings = ["error"]
markers = [
    "integration: runs against a real database",
    "e2e: drives the CLI against a real app",
]

[tool.coverage.run]
source = ["caching_service", "cache_cli"]
branch = true
# SQLAlchemy's async layer runs database calls on greenlets; without this, lines after
# an `await session...` are misreported as uncovered.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
# The module guard only runs when invoked as `python -m`; tests call main() directly.
exclude_also = ['if __name__ == "__main__":']
