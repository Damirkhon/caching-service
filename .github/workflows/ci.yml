name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.21"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The Makefile runs uv with UV_LOCKED=1, so a stale uv.lock fails here rather than
      # being silently re-resolved: CI must test exactly what the Docker image ships.
      - run: make install
      - run: make lint
      - run: make typecheck

  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Both legs always finish, so a dialect-specific failure is never hidden by the other.
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        # An empty image skips the service, so only the postgres leg starts a database.
        image: ${{ matrix.db == 'postgres' && 'postgres:17.11-alpine' || '' }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        # Over TCP: the image's temporary init server only listens on a socket.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The same suite on both legs; an empty value falls back to a temporary SQLite file.
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+asyncpg://test:test@localhost:5432/test' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make install
      - run: make test PYTEST_ARGS="--cov-report=xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.db }}
          path: coverage.xml
          if-no-files-found: error

  docker:
    name: Docker smoke test
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the image, starts the Compose stack, drives it with cache-cli, tears it down.
      - run: make smoke
